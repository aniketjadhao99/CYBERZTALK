<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expert Profile - Cyberztalk</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="js/config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script id="tailwind-config">tailwind.config = { theme: { extend: { colors: { primary: '#006688', secondary: '#006b5f', surface: '#f5f7fa', 'on-surface': '#131b2e' } } } };</script>
    <style>body { font-family: Inter, sans-serif; background: #f5f7fa; } h1, h2, h3 { font-family: Geist, sans-serif; }</style>
</head>
<body class="min-h-screen text-on-surface">
    <header class="bg-white border-b border-gray-200"><div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between"><a href="index.html" class="flex items-center gap-3 text-primary font-bold text-xl"><span class="w-9 h-9 rounded bg-primary text-white flex items-center justify-center">C</span>Cyberztalk</a><a href="index.html" class="text-sm font-semibold text-primary">Back to home</a></div></header>
    <main class="max-w-6xl mx-auto px-4 sm:px-6 py-8 sm:py-12">
        <div id="loading" class="bg-white rounded-lg border border-gray-200 p-12 text-center text-gray-500">Loading expert profile...</div>
        <div id="profilePage" class="hidden grid grid-cols-1 lg:grid-cols-3 gap-6">
            <section class="lg:col-span-2 bg-white rounded-lg border border-gray-200 p-6 sm:p-8">
                <div class="flex flex-col sm:flex-row items-start gap-5 border-b border-gray-200 pb-7"><div id="avatar" class="w-20 h-20 rounded-full bg-primary text-white flex items-center justify-center text-3xl font-bold"></div><div><p class="text-sm font-semibold text-primary uppercase tracking-wide">Cyberztalk expert</p><h1 id="name" class="text-3xl font-bold mt-1"></h1><p id="headline" class="text-primary font-semibold mt-2"></p><p id="location" class="text-sm text-gray-500 mt-2"></p></div></div>
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-4 py-6 border-b border-gray-200"><div><p class="text-xs text-gray-500 uppercase">Experience</p><p id="experience" class="font-bold text-lg mt-1"></p></div><div><p class="text-xs text-gray-500 uppercase">Fee</p><p id="fee" class="font-bold text-lg mt-1"></p></div><div><p class="text-xs text-gray-500 uppercase">Availability</p><p id="availability" class="font-bold text-lg mt-1"></p></div></div>
                <div class="py-6 border-b border-gray-200"><h2 class="text-xl font-bold">About this expert</h2><p id="bio" class="text-gray-600 leading-7 mt-3"></p></div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 pt-6"><div><h2 class="font-bold">Specialties</h2><div id="specialties" class="flex flex-wrap gap-2 mt-3"></div></div><div><h2 class="font-bold">Credentials</h2><ul id="credentials" class="text-gray-600 text-sm space-y-2 mt-3"></ul></div></div>
                <div class="mt-6"><h2 class="font-bold">Languages</h2><p id="languages" class="text-gray-600 text-sm mt-2"></p></div>
            </section>
            <aside class="bg-white rounded-lg border border-gray-200 p-6 h-fit lg:sticky lg:top-6"><p class="text-sm text-gray-500">Book a private consultation</p><h2 class="text-2xl font-bold mt-2">Choose your session</h2><form id="bookingForm" class="space-y-4 mt-6"><div><label for="duration" class="block text-sm font-semibold mb-2">Session length</label><select id="duration" class="w-full rounded border-gray-300"><option value="30">30 minutes</option><option value="60">60 minutes</option></select></div><div><label for="date" class="block text-sm font-semibold mb-2">Preferred date and time (IST)</label><input id="date" type="datetime-local" class="w-full rounded border-gray-300" required><p class="text-xs text-gray-500 mt-1">Times are scheduled in India Standard Time.</p></div><div><label for="note" class="block text-sm font-semibold mb-2">What do you need help with?</label><textarea id="note" rows="4" maxlength="500" class="w-full rounded border-gray-300" placeholder="Briefly describe your concern"></textarea></div><div class="border-t border-gray-200 pt-4 flex items-center justify-between"><span class="text-sm text-gray-500">Estimated total</span><strong id="total" class="text-xl text-primary"></strong></div><button class="w-full bg-primary text-white rounded py-3 font-semibold hover:bg-on-surface transition">Request consultation</button><p id="message" class="hidden rounded px-3 py-2 text-sm"></p></form></aside>
        </div>
    </main>
    <script>
        const expertId = new URLSearchParams(window.location.search).get('id');
        let profile;
        const token = localStorage.getItem('authToken');
        const money = value => new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR' }).format(Number(value));
        const label = value => (value || '').replaceAll('-', ' ').replace(/\b\w/g, letter => letter.toUpperCase());
        async function loadProfile() { try { if (!expertId) throw new Error('Expert profile not found'); const response = await fetch(`${window.API_BASE_URL}/bookings/experts/${expertId}`); const result = await response.json(); if (!response.ok || !result.success) throw new Error(result.message); profile = result.data; const user = profile.user || {}; document.title = `${user.fullName || 'Expert'} - Cyberztalk`; document.getElementById('avatar').textContent = (user.fullName || 'E').charAt(0); document.getElementById('name').textContent = user.fullName || 'Cybersecurity Expert'; document.getElementById('headline').textContent = profile.headline || 'Cybersecurity specialist'; document.getElementById('location').textContent = user.location || profile.location || 'Remote consultations · India'; document.getElementById('experience').textContent = `${profile.yearsOfExperience || 0} years`; document.getElementById('fee').textContent = `${money(profile.feePerMinute || 0)}/min`; const availability = document.getElementById('availability'); availability.textContent = label(profile.availability || 'available'); availability.className = `font-bold text-lg mt-1 ${availabilityColor(profile.availability)}`; document.getElementById('bio').textContent = profile.bio || 'Ready to help you understand and respond to a cyber incident.'; document.getElementById('specialties').innerHTML = (profile.specialties || []).map(item => `<span class="bg-sky-50 text-primary rounded px-3 py-1 text-sm">${label(item)}</span>`).join('') || '<span class="text-sm text-gray-500">General cybercrime support</span>'; document.getElementById('credentials').innerHTML = (profile.credentials || []).map(item => `<li>• ${item}</li>`).join('') || '<li class="text-gray-500">Profile credentials not added yet.</li>'; document.getElementById('languages').textContent = (profile.languages || []).join(', ') || 'English'; document.getElementById('profilePage').classList.remove('hidden'); document.getElementById('loading').classList.add('hidden'); updateTotal(); } catch (error) { document.getElementById('loading').textContent = error.message || 'Unable to load this expert profile.'; } }
        function updateTotal() { document.getElementById('total').textContent = money((profile?.feePerMinute || 0) * Number(document.getElementById('duration').value)); }
        function availabilityColor(value) { return value === 'offline' ? 'text-red-700' : value === 'busy' ? 'text-yellow-700' : 'text-green-700'; }
        document.getElementById('duration').addEventListener('change', updateTotal);
        document.getElementById('bookingForm').addEventListener('submit', async event => { event.preventDefault(); if (!token) { window.location.href = `login.html?redirect=expert-profile.html?id=${expertId}`; return; } const message = document.getElementById('message'); try { const response = await fetch(`${window.API_BASE_URL}/bookings`, { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` }, body: JSON.stringify({ expertId, preferredDate: document.getElementById('date').value, durationMinutes: Number(document.getElementById('duration').value), note: document.getElementById('note').value }) }); const result = await response.json(); if (!response.ok || !result.success) throw new Error(result.message || 'Unable to request consultation'); message.textContent = 'Consultation request sent. You can track it from your dashboard.'; message.className = 'rounded px-3 py-2 text-sm bg-green-50 text-green-700'; } catch (error) { message.textContent = error.message; message.className = 'rounded px-3 py-2 text-sm bg-red-50 text-red-700'; } message.classList.remove('hidden'); });
        loadProfile();
    </script>
</body>
</html>
